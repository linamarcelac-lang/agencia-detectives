<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El misterio del mensaje perdido · Agencia de Detectives</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&display=swap">
<style>
/* VOICE: juego de detectives para tercero, emocionante y claro; el docente lo proyecta para competir en grupo.
   IDEA: un mapa del colegio que se explora como en un videojuego; cada persona del mapa guarda un acertijo de comunicación.
   PICTURE: el mapa del colegio dibujado en canvas con zonas, personajes con "!" y lupas escondidas.
   COLOUR and TYPE: papel kraft y tinta azul de la Agencia; colores por zona; Fredoka para títulos, Nunito para leer.
   LAYOUT: pantalla de inicio con tres modos; juego con barra de estado arriba y mapa grande; ventanas de acertijo encima. */
:root{color-scheme:light;--bg:#F6EBD6;--paper:#FFFBF2;--ink:#1F2433;--ink2:#545A6B;--acc:#C8382E;--acc2:#FBE0DC;--ok:#1F8A4C;--sh:4px 4px 0 var(--ink)}

h1,h2,h3{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:4px solid #E8A825;outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:20px}
.btn{border:3px solid var(--ink);background:var(--acc);color:#fff;border-radius:14px;padding:9px 18px;font-weight:900;box-shadow:3px 3px 0 var(--ink);min-height:46px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}.btn.small{padding:5px 12px;min-height:40px;font-size:.92rem}.btn.blue{background:#2C5DA8}.btn.green{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:900;margin:12px 0 6px}
select,input[type=text]{padding:9px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-weight:800;min-height:46px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:900;font-size:.9rem;background:#fff}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}
.mode{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:18px;color:var(--ink);display:grid;gap:8px;align-content:start}
.mode .ic{font-size:2.2rem}.mode h3{font-size:1.3rem}.mode small{color:var(--ink2);font-weight:800}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.8rem)}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 16px;box-shadow:var(--sh);margin-top:10px}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.scale div{border:2.5px solid var(--ink);border-radius:12px;padding:8px;text-align:center;font-weight:900;background:#fff}
.scale b{display:block;font-family:Fredoka,sans-serif;font-size:1.05rem}
.S{background:#D8F0E2!important}.A{background:#DCE7F7!important}.B{background:#FFF0C7!important}.J{background:#FBE0DC!important}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink)}.swatches button[aria-pressed=true]{box-shadow:0 0 0 4px #E8A825}
/* juego */
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.hud .chip{background:#fff}.hud .grow{flex:1}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:var(--sh);background:#E9DCC0;touch-action:none}
canvas#world{display:block;width:100%;height:auto}
.prompt{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:#FFF4D6;border-radius:999px;padding:8px 16px;font-weight:900;display:none;white-space:nowrap}
.help{font-size:.9rem;color:var(--ink2);margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(31,36,51,.6);display:none;place-items:center;z-index:50;padding:14px}.modal.show{display:grid}
.modal .card{max-width:640px;width:100%;max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}

.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}.who .face{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:1.6rem;flex:none}
.ctx{background:#fff;border:2.5px dashed var(--ink2);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:800}
.q{font:600 1.25rem/1.3 Fredoka,sans-serif;margin:10px 0}
.opts{display:grid;gap:10px}.opts .btn{background:#fff;color:var(--ink);justify-content:flex-start;text-align:left}
.opts .btn.ok{background:#D8F0E2;border-color:var(--ok)}.opts .btn.bad{background:#FBE0DC}

.code{font:700 clamp(1.1rem,3.5vw,1.6rem) monospace;background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:10px;word-break:break-all;margin:10px 0}
.mastery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}

.mastery i{display:block;height:10px;border:2px solid var(--ink);border-radius:999px;margin-top:6px;background:linear-gradient(90deg,var(--ok) var(--p),#fff var(--p))}

.track{position:relative;height:300px;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(90deg,#FBE0DC 0 50%,#FFF0C7 50% 72.5%,#DCE7F7 72.5% 90%,#D8F0E2 90%);overflow:hidden;box-shadow:var(--sh)}

table{width:100%;border-collapse:collapse;background:#fff}th,td{border:2px solid var(--ink);padding:6px 8px;text-align:left;font-size:.92rem}th{background:var(--acc2)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:110px;border:3px solid var(--ink);border-radius:12px;padding:10px;font:700 1rem monospace}
.gbars{display:grid;gap:6px}.gbar{display:grid;grid-template-columns:130px 1fr 60px;gap:8px;align-items:center;font-weight:900;font-size:.9rem}
.gbar i{display:block;height:22px;border:2.5px solid var(--ink);border-radius:6px;background:#2C5DA8}
/* carrera */
.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.lane .nm{font:700 1.05rem Fredoka,sans-serif;display:flex;gap:6px;align-items:center}
.lane .road{position:relative;height:56px;border:3px solid var(--ink);border-radius:999px;background:repeating-linear-gradient(90deg,#fff 0 9.5%,#F3E3C3 9.5% 10%)}
.lane .runner{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:2rem;transition:left .8s cubic-bezier(.2,.9,.3,1)}
.lane .goal{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:1.5rem}
.bigq{font:600 clamp(1.4rem,3.4vw,2.2rem)/1.25 Fredoka,sans-serif;margin:10px 0}
.bigopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bigopts div{border:3px solid var(--ink);border-radius:14px;padding:14px;font:600 1.2rem Fredoka,sans-serif;background:#fff}
.bigopts div b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;margin-right:8px}
.bigopts div.ok{background:#D8F0E2;border-color:var(--ok)}
.teamtoggle{display:flex;gap:8px;flex-wrap:wrap}.teamtoggle button[aria-pressed=true]{background:#D8F0E2;border-color:var(--ok)}
#party{position:fixed;inset:0;pointer-events:none;z-index:90}
.foot{text-align:center;color:var(--ink2);font-size:.85rem;padding:20px}
@media (max-width:760px){.modes,.scale,.mastery,.bigopts{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.lane{grid-template-columns:1fr}.gbar{grid-template-columns:90px 1fr 50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="mastery">${Object.entries(m).map(([k,v])=>{const p=v[1]?Math.round(v[0]/v[1]*100):0;return `<div>${ELEM[k]}<br>${p}%<i style="--p:${p}%"></i></div>`}).join('')}</div>
  <h3>Tu código de detective</h3><div class="code" id="code">${code}</div>
  <p>✏️ Copia este código en la <b>tarea de la semana 1 en el AVA</b> o dáselo a tu docente para la Arena de la clase.</p>
  <div class="row" style="justify-content:center"><button class="btn" id="cp">📋 Copiar código</button><button class="btn ghost" id="again">Jugar otra vez</button><button class="btn ghost" id="hm">Inicio</button></div><p class="help" id="cpm" aria-live="polite"></p>
  <p class="help">Si juegas otra vez, el código dirá el número de intento. Tu docente decide qué intento cuenta.</p></div>`;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#cpm').textContent='¡Código copiado!'}catch(e){$('#cpm').textContent='Selecciona el código y cópialo a mano.'}};$('#again').onclick=setup;$('#hm').onclick=home}
 const kd=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(modal.classList.contains('show')){if(e.key==='Escape'&&!$('#mnext')&&!$('.opts .btn:not(:disabled)',mcard)&&!$('#mchk'))closeM();return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','s','d','w'].includes(k)){keys[k]=true;e.preventDefault()}if(e.key===' '){e.preventDefault();talk(near())}};
 const ku=e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false};
 addEventListener('keydown',kd);addEventListener('keyup',ku);
 cv.addEventListener('pointerdown',e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*960/b.width,y=(e.clientY-b.top)*600/b.height;let hit=null;npcs().forEach(i=>{if(Math.hypot(R[i].x-x,R[i].y-y)<34)hit=i});
  if(hit!=null){const r=R[hit];st.tx=r.x;st.ty=r.y+40;st.pend=hit}else{st.tx=x;st.ty=y;st.pend=null}});
 $('#mute').onclick=()=>{muted=!muted;store.set('juego_mute',muted);$('#mute').textContent=muted?'🔇':'🔊'};
 $('#fin').onclick=()=>{openM(`<h3>¿Terminar la misión?</h3><p>Llevas ${Object.keys(st.done).length} de ${R.length} acertijos. Los que no resolviste quedan con 0 puntos.</p><div class="row"><button class="btn" id="y">Sí, terminar</button><button class="btn ghost" id="n">Seguir jugando</button></div>`);$('#y').onclick=()=>{closeM();end()};$('#n').onclick=closeM};
 stopGame=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);stopGame=null};
 hud();step();
 openM(`<div class="who"><div class="face" style="background:#9A6539">🦉</div><div><h3>Olivia</h3><small>Jefa de la Agencia</small></div></div><p>¡Bienvenido, detective <b>${E(P.name)}</b>! Hay <b>15 acertijos</b> escondidos con las personas del colegio (las que tienen <b>!</b>).</p><p>1️⃣ Busca primero las <b>4 lupas ✨</b> en las esquinas: te enseñan las pistas.<br>2️⃣ Resuelve los acertijos de las 4 zonas.<br>3️⃣ Ven a la Agencia para el <b>gran acertijo</b>.</p><p>Cada acertijo vale 100 puntos al primer intento y 50 al segundo. ¡Piensa antes de responder!</p><button class="btn" id="mok">¡Vamos! 🔎</button>`);$('#mok').onclick=closeM}

/* ================= arena ================= */
function arena(){stopGame&&stopGame();let list=store.get('det_arena',[]);let filt=store.get('det_arena_f','ALL');
 app.innerHTML=`<div class="row"><button class="btn small ghost" id="back">← Inicio</button><h2 style="flex:1">🏟️ Arena de la clase</h2><select id="fl" aria-label="Filtrar grupo"></select></div>
 <div class="card" style="margin-top:12px"><label class="f" for="codes">Pega los códigos de los estudiantes, uno por línea</label><textarea id="codes" placeholder="DET-R3A-SOFIAGOMEZ-1450-1-XX"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="add">Agregar a la arena</button><button class="btn ghost small" id="clr">Vaciar arena</button><span class="help" id="msg" aria-live="polite"></span></div>
 <p class="help">Si un estudiante tiene varios intentos, la arena guarda el de mayor puntaje. Los datos quedan solo en este computador.</p></div>
 <h3 style="margin:20px 0 8px">Camino al Foro: todos en la misma escena</h3><div class="track" id="track"></div>
 <div class="podium" id="pod"></div>
 <div class="grid card" style="margin-top:16px"><h3>Promedio por grupo</h3><div class="gbars" id="gb" style="margin-top:10px"></div></div>
 <div class="card" style="margin-top:16px"><div class="row"><h3 style="flex:1">Notas</h3><button class="btn small blue" id="cpy">📋 Copiar para Excel</button></div><div class="scroll" style="margin-top:10px"><table id="tb"></table></div><p class="help" id="cmsg" aria-live="polite"></p></div>`;
 const opts=['ALL',...Object.entries(SEDES).flatMap(([s,v])=>v.groups.map(g=>s+g))];$('#fl').innerHTML=opts.map(o=>`<option value="${o}">${o==='ALL'?'Todos los grupos':SEDES[o[0]].name+' '+o.slice(1)}</option>`).join('');$('#fl').value=filt;
 const draw=()=>{const L=list.filter(x=>filt==='ALL'||x.sede+x.grp===filt).sort((a,b)=>b.pts-a.pts);
  let h='';[[50,'Bajo'],[72.5,'Básico'],[90,'Alto'],[100,'Superior']].forEach(([p,t],i)=>{const st=i?[50,72.5,90][i-1]:0;h+=`<div class="zone" style="left:${(st+p)/2}%">${t}</div>`;if(p<100)h+=`<div class="tick" style="left:${p}%"></div>`});
  const used={};L.forEach(x=>{const pos=Math.min(93,Math.max(4,(x.nota-1)/4*100));const b=Math.round(pos/4);used[b]=(used[b]||0)+1;const row=used[b]-1;const top=60+(row%5)*46+(Math.floor(row/5)%2)*20;h+=`<div class="av" style="left:${pos}%;top:${top}px;background:${COLORS[(x.name.length+x.grp.charCodeAt(1))%COLORS.length]}" title="${E(x.name)}">${E(x.name.slice(0,2))}<span>${E(x.name.slice(0,9))}</span></div>`});
  $('#track').innerHTML=h||'<p style="padding:40px;text-align:center">Agrega códigos para ver a los detectives en la escena.</p>';
  $('#pod').innerHTML=L.length?[1,0,2].filter(i=>L[i]).map(i=>`<div class="p${i+1}">${['🥇','🥈','🥉'][i]}<br>${E(L[i].name)}<br>${L[i].nota.toFixed(1).replace('.',',')}</div>`).join(''):'';
  const G={};list.forEach(x=>{const k=x.sede+x.grp;(G[k]=G[k]||[]).push(x.nota)});const ga=Object.entries(G).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length,v.length]).sort((a,b)=>b[1]-a[1]);
  $('#gb').innerHTML=ga.map(([k,avg,n])=>`<div class="gbar"><span>${SEDES[k[0]].name} ${k.slice(1)}</span><i style="width:${(avg-1)/4*100}%"></i><b>${avg.toFixed(1).replace('.',',')}</b></div><div class="help" style="margin:-4px 0 4px 138px">${n} estudiantes</div>`).join('')||'<p class="help">Aún no hay grupos.</p>';
  $('#tb').innerHTML='<tr><th>#</th><th>Estudiante</th><th>Sede</th><th>Grupo</th><th>Puntos</th><th>Nota</th><th>Desempeño</th><th>Intento</th></tr>'+L.map((x,i)=>{const lv=level(x.nota);return `<tr><td class="n">${i+1}</td><td>${E(x.name)}</td><td>${SEDES[x.sede].name}</td><td>${x.grp}</td><td class="n">${x.pts}</td><td class="n">${x.nota.toFixed(1).replace('.',',')}</td><td class="${lv[2]}">${lv[1]}</td><td class="n">${x.att}</td></tr>`}).join('');
  store.set('det_arena',list);store.set('det_arena_f',filt)};
 $('#add').onclick=()=>{let ok=0,bad=[];$('#codes').value.split(/\s+/).filter(Boolean).forEach(c=>{const p=parseCode(c);if(!p||p.bad){bad.push(c);return}const k=p.sede+p.grp+p.name;const ex=list.find(x=>x.sede+x.grp+x.name===k);if(!ex)list.push(p);else if(p.pts>ex.pts)Object.assign(ex,p);ok++});
  $('#msg').textContent=`${ok} código(s) agregados.`+(bad.length?` ${bad.length} no válidos: ${bad.slice(0,3).join(', ')}`:'');if(ok){$('#codes').value='';sWin()}draw()};
 $('#clr').onclick=()=>{openM(`<h3>¿Vaciar la arena?</h3><p>Se borran todos los códigos guardados en este computador.</p><div class="row"><button class="btn" id="y">Sí, vaciar</button><button class="btn ghost" id="n">Cancelar</button></div>`);$('#y').onclick=()=>{list=[];closeM();draw()};$('#n').onclick=closeM};
 $('#fl').onchange=()=>{filt=$('#fl').value;draw()};
 $('#cpy').onclick=async()=>{const L=list.filter(x=>filt==='ALL'||x.sede+x.grp===filt);const t='Estudiante\tSede\tGrupo\tPuntos\tNota\tDesempeño\tIntento\n'+L.map(x=>[x.name,SEDES[x.sede].name,x.grp,x.pts,x.nota.toFixed(1).replace('.',','),level(x.nota)[1],x.att].join('\t')).join('\n');try{await navigator.clipboard.writeText(t);$('#cmsg').textContent='¡Copiado! Pégalo en Excel o en el calificador.'}catch(e){$('#cmsg').textContent='No se pudo copiar automáticamente.'}};
 $('#back').onclick=home;draw()}

/* ================= carrera de equipos ================= */
function race(){stopGame&&stopGame();
 const bank=shuffle([...R.filter(r=>r.type==='c').map(r=>({q:(r.ctx.replace(/^🧩 |^Gran acertijo \d de \d: /,'')+' '+r.q.replace(/<[^>]+>/g,'')),o:r.o})),...EXTRA]);
 const EMO=['🕵️','🦊','🐢','🐯','🐼','🦉'];
 app.innerHTML=`<div class="row"><button class="btn small ghost" id="back">← Inicio</button><h2 style="flex:1">🏁 Carrera de equipos</h2></div><div class="card" style="margin-top:12px;max-width:640px"><label class="f" for="nt">¿Cuántos equipos?</label><select id="nt">${[2,3,4,5,6].map(n=>`<option${n===4?' selected':''}>${n}</option>`).join('')}</select><div id="tn"></div><label class="f" for="goal">Meta (respuestas correctas para ganar)</label><select id="goal"><option>5</option><option selected>8</option><option>10</option></select>
 <p class="help">Cada equipo responde en una hoja o con tarjetas A, B y C. El docente marca qué equipos acertaron y sus detectives avanzan.</p><button class="btn" id="go">¡Empezar la carrera! 🏁</button></div>`;
 const tn=()=>{const n=+$('#nt').value;$('#tn').innerHTML=Array.from({length:n},(_,i)=>`<label class="f" for="t${i}">Equipo ${i+1}</label><input type="text" id="t${i}" value="${['Lupas','Huellas','Pistas','Linternas','Brújulas','Libretas'][i]}" maxlength="16">`).join('')};$('#nt').onchange=tn;tn();$('#back').onclick=home;
 $('#go').onclick=()=>{const n=+$('#nt').value,goal=+$('#goal').value;const T=Array.from({length:n},(_,i)=>({name:$('#t'+i).value.trim()||'Equipo '+(i+1),e:EMO[i],p:0}));let qi=0,phase='ask',right={};
  const draw=()=>{const q=bank[qi%bank.length];const order=q._o||(q._o=shuffle(q.o.map((t,k)=>({t,k}))));const win=T.filter(t=>t.p>=goal);
   app.innerHTML=`<div class="row"><button class="btn small ghost" id="back">← Salir</button><h2 style="flex:1">🏁 Carrera de equipos · meta ${goal}</h2><span class="chip">Pregunta ${qi+1}</span></div>
   <div class="lanes card" style="margin-top:12px">${T.map(t=>`<div class="lane"><div class="nm">${t.e} ${E(t.name)} <span class="chip">${t.p}</span></div><div class="road"><span class="runner" style="left:${4+t.p/goal*86}%">${t.e}</span><span class="goal">🏆</span></div></div>`).join('')}</div>
   ${win.length?`<div class="card" style="margin-top:14px;text-align:center"><h2>🏆 ¡Gana ${win.map(w=>E(w.name)).join(' y ')}!</h2><p>Excelente trabajo, detectives.</p><button class="btn" id="re">Nueva carrera</button></div>`:
   `<div class="card" style="margin-top:14px"><div class="bigq">${E(q.q)}</div><div class="bigopts">${order.map((o,i)=>`<div class="${phase==='show'&&o.k===0?'ok':''}"><b>${'ABC'[i]}</b>${E(o.t)}</div>`).join('')}</div>
   ${phase==='ask'?`<div class="row" style="margin-top:14px"><button class="btn" id="rev">Mostrar respuesta</button><span class="help">Den tiempo para pensar y escribir la letra.</span></div>`:
   `<p style="margin-top:14px;font-weight:900">¿Qué equipos acertaron? (respuesta ${'ABC'[order.findIndex(o=>o.k===0)]})</p><div class="teamtoggle">${T.map((t,i)=>`<button class="btn ghost small" data-t="${i}" aria-pressed="${!!right[i]}">${t.e} ${E(t.name)}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn green" id="adv">Avanzar y siguiente pregunta →</button></div>`}</div>`}`;
   $('#back').onclick=home;if(win.length){confetti();sWin();$('#re').onclick=race;return}
   if(phase==='ask')$('#rev').onclick=()=>{phase='show';sPick();draw()};
   else{$$('[data-t]').forEach(b=>b.onclick=()=>{right[b.dataset.t]=!right[b.dataset.t];b.setAttribute('aria-pressed',!!right[b.dataset.t])});$('#adv').onclick=()=>{T.forEach((t,i)=>{if(right[i])t.p++});if(Object.values(right).some(Boolean))sOk();right={};phase='ask';qi++;draw()}}};
  draw()}}

addEventListener('click',e=>{if(e.target===modal&&!$('#mnext')&&!$('.opts .btn:not(:disabled)',mcard)&&!$('#mchk'))closeM()});
home();
}
</script>
