<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agencia de Detectives · Detectives de nuestra comunidad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap">
<style>
/* VOICE: misión de detectives para niños de 8 y 9 años, cálida y clara; el docente encuentra su plan en la misma página.
   IDEA: una agencia de detectives: cada fase es un expediente con su ruta de pistas, su laboratorio y sus retos.
   PICTURE: Olivia, la búho detective, en el encabezado de cada expediente, y la ruta de retos como un camino de huellas.
   COLOUR and TYPE: papel kraft y tinta azul oscuro, un color de sello por expediente; Fredoka para títulos, Nunito para leer.
   LAYOUT: barra fija, héroe con burbuja, pestañas estudiante/docente, tarjetas de contorno grueso en una columna. */
:root{color-scheme:light;--bg:#F6EBD6;--paper:#FFFBF2;--ink:#1F2433;--ink2:#545A6B;--line:#1F2433;
 --acc:#C8382E;--acc2:#FBE0DC;--accInk:#fff;--ok:#1F8A4C;--bad:#C8382E;--r:18px;--sh:4px 4px 0 var(--line)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:clip;
 background-image:radial-gradient(rgba(31,36,51,.09) 1.2px,transparent 1.3px);background-size:22px 22px}
h1,h2,h3,h4,.disp{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:4px solid #E8A825;outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
u{text-decoration-color:var(--acc);text-decoration-thickness:3px;text-underline-offset:3px;font-weight:800}
/* barra */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:3px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;background:#FFE9B8;border:2.5px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:2px 2px 0 var(--line)}
.brand{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:900;background:var(--ink);color:#FFD66B;border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px}
.ttl{flex:1;min-width:200px;display:flex;align-items:center;gap:10px}.ttl h1{font-size:1.3rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem;background:var(--acc2)}
.iconbtn{border:2.5px solid var(--line);background:#fff;border-radius:12px;min-width:44px;height:44px;font-size:1.15rem;box-shadow:2px 2px 0 var(--line)}
/* héroe */
.hero{padding:26px 0 6px}.hero .wrap{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.hero h2{font-size:clamp(1.8rem,4.4vw,2.7rem)}
.kicker{font-weight:900;letter-spacing:.5px;font-size:.85rem;color:var(--acc)}
.olv{display:inline-flex;align-items:center;gap:6px;margin:8px 0 0;border:3px solid var(--line);background:#FFF0C7;border-radius:999px;padding:5px 12px;font:800 .9rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line)}.olv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}.olv.on{background:#1F8A4C;color:#fff;animation:olvp 1s infinite}@keyframes olvp{50%{transform:scale(1.05)}}.bubble .olv{display:flex;width:max-content}
.sec.card.gamecard{background:linear-gradient(135deg,#2B3046,#3F4A6B);color:#FFF4D6}.gamecard h3{font-size:1.6rem;margin:.2em 0;color:#fff}.gamecard .kicker{color:#FFD36B}.gamecard p{margin:.4em 0}.gamecard .note{color:#FFD36B;background:transparent;border:0;padding:0}.gc-in{display:flex;gap:18px;align-items:flex-start}.gc-ic{font-size:4rem;line-height:1}.gc-sc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.gc-sc .chip{color:#1F2433}.gc-btn{display:inline-block;background:#E8A825;color:#1F2433;border:3px solid #1F2433;border-radius:999px;padding:10px 22px;font:900 1.15rem Nunito,sans-serif;text-decoration:none;box-shadow:0 4px 0 #1F2433}.gc-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1F2433}@media(max-width:640px){.gc-in{flex-direction:column}}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--sh);margin-top:12px;max-width:660px}
.bubble:before{content:"";position:absolute;left:-14px;top:22px;border:10px solid transparent;border-right-color:var(--line)}
.olivia{flex:none;filter:drop-shadow(3px 4px 0 rgba(31,36,51,.22))}.olivia.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
/* tarjetas */
.sec{margin:26px 0}.card{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accInk);border:3px solid var(--line);display:grid;place-items:center;font:700 1.1rem Fredoka,sans-serif}
.sechead h3{font-size:1.4rem}.sub{display:block;font-size:.82rem;color:var(--ink2);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mini{background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:14px}
.mini h4{margin:0 0 6px;font-size:1.08rem}
ul.clean{list-style:none;padding:0;margin:0}ul.clean li{padding:6px 0 6px 32px;position:relative}
ul.clean li:before{content:"✓";position:absolute;left:4px;top:7px;width:21px;height:21px;border-radius:50%;background:var(--acc);color:var(--accInk);border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:900}
.vocab{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.vocab span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-weight:800;font-size:.9rem}
.note{font-size:.88rem;color:var(--ink2);margin-top:8px}
.job{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start}
.jobpic{width:110px;height:110px;border-radius:24px;border:3px solid var(--line);background:var(--acc2);display:grid;place-items:center;font-size:3.4rem;box-shadow:3px 3px 0 var(--line)}
.write{margin-top:14px;border:2.5px solid var(--line);border-left:10px solid var(--acc);border-radius:12px;padding:10px 14px;background:repeating-linear-gradient(#fff 0 29px,#D6E3F5 29px 30px)}
.write b.lbl{display:inline-block;background:var(--acc);color:var(--accInk);border:2px solid var(--line);border-radius:8px;padding:0 8px;margin-right:6px;font-family:Fredoka,sans-serif;font-weight:600}
.parts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.part{flex:1 1 180px;background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:10px 12px}
.part .k:only-child{}.part b{display:block;font:700 1.05rem Fredoka,sans-serif}.part .k{font:800 .95rem Nunito,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.part small{display:block;color:var(--ink2);font-weight:700;margin-top:2px}
.example{margin-top:12px;background:var(--acc2);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.vrc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.vrc .mini{border-top-width:8px}.vrc .v1{border-top-color:#1F8A4C}.vrc .v2{border-top-color:#E8A825}.vrc .v3{border-top-color:#2C5DA8}
.vrc h4 small{display:block;font:800 .72rem Nunito,sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--ink2)}
.vrc .write{font-size:.92rem}
.strat{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.strat .mini{position:relative;padding-top:20px}
.strat .mini:before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:12px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 .9rem Fredoka,sans-serif}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.res a,.res div.r{display:flex;gap:12px;align-items:center;text-decoration:none;background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:12px;box-shadow:2px 2px 0 var(--line)}
.res a:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.res .ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--acc2);border:2px solid var(--line)}
.res b{display:block;line-height:1.2}.res small{color:var(--ink2);font-weight:700}
.booklet{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.folder{min-height:210px;border:3px solid var(--line);border-radius:6px 16px 12px 12px;background:#F3D9A4;position:relative;box-shadow:5px 5px 0 var(--line);padding:30px 12px 12px}
.folder:before{content:"";position:absolute;left:-3px;top:-18px;width:70px;height:20px;background:#F3D9A4;border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
.folder b{display:block;font:700 1rem/1.15 Fredoka,sans-serif}.folder span{position:absolute;bottom:12px;left:12px;right:12px;background:var(--acc);color:var(--accInk);border:2px solid var(--line);border-radius:8px;padding:2px 6px;font-weight:900;font-size:.8rem;transform:rotate(-4deg);text-align:center}
/* calentamiento */
.gate{background:linear-gradient(180deg,#fff,var(--acc2))}
.dots{display:flex;gap:8px;margin:8px 0 14px}.dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);background:#fff}.dots i.on{background:var(--ok)}.dots i.cur{background:var(--acc)}
.locked{filter:blur(2px) grayscale(.5);opacity:.45;pointer-events:none;user-select:none;max-height:640px;overflow:hidden}
.gate-done{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--ok);flex-wrap:wrap}
/* preguntas */
.q{font-size:1.2rem;font-weight:800;margin:6px 0 12px}
.ctx{background:#fff;border:2px dashed var(--ink2);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ansrow input{font:700 1.3rem Fredoka,sans-serif;width:200px;max-width:100%;padding:8px 14px;border:3px solid var(--line);border-radius:12px;background:#fff}
.btn{border:3px solid var(--line);background:var(--acc);color:var(--accInk);border-radius:14px;padding:9px 20px;font-weight:900;box-shadow:3px 3px 0 var(--line);transition:transform .08s;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:#fff;color:var(--ink)}.btn.small{padding:5px 12px;font-size:.92rem;border-width:2.5px;box-shadow:2px 2px 0 var(--line)}
.opts{display:flex;gap:10px;flex-wrap:wrap}.opts .btn{background:#fff;color:var(--ink);text-align:left}
.opts .btn.sel-ok{background:#D8F0E2;border-color:var(--ok)}.opts .btn.sel-bad{background:#FBE0DC}
.fb{min-height:28px;margin-top:12px;font-weight:800}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.why{background:#D8F0E2;border:2.5px solid var(--ok);border-radius:12px;padding:10px 14px;margin-top:10px;display:none}
.wline{margin-top:12px;background:#fff;border:2px dashed var(--acc);border-radius:10px;padding:6px 12px;font-size:.95rem}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ruta de retos */
.path{display:flex;align-items:center;margin:6px 0 18px;overflow-x:auto;padding:6px 2px}
.path .node{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font:700 1.1rem Fredoka,sans-serif;transition:transform .2s}
.path .node.cur{background:var(--acc);color:var(--accInk);transform:scale(1.12)}.path .node.done{background:var(--ok);color:#fff}
.path .seg{flex:1;min-width:16px;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}.path .seg.done{background:var(--ok)}
.path .flag{flex:none;font-size:1.8rem;margin-left:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.stats .chip{background:#fff}
/* tarea */
.task{background:repeating-linear-gradient(-45deg,var(--acc2) 0 14px,#fff 14px 28px)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok);margin-top:2px;flex:none}
/* pestañas */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.tab{border:3px solid var(--line);background:#fff;border-radius:14px 14px 0 0;padding:10px 18px;font:600 1.05rem Fredoka,sans-serif;border-bottom-width:0;position:relative;top:3px;min-height:48px}
.tab.on{background:var(--acc);color:var(--accInk)}.tabline{border-top:3px solid var(--line)}
/* docente */
.prog{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.prog a{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:700 .95rem Fredoka,sans-serif;text-decoration:none;color:#fff}
.stg{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:900;font-size:.76rem;color:#fff}
.stg.L{background:#2C5DA8}.stg.S{background:#1F7A57}.stg.T{background:#C26419}.stg.P{background:#6B3FA0}
details.les{background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--line);margin:12px 0}
details.les summary{cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;list-style:none;min-height:48px}
details.les summary::-webkit-details-marker{display:none}
details.les summary .ln{font:700 1rem Fredoka,sans-serif;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;background:#fff}
details.les summary h4{flex:1;min-width:180px;font-size:1.12rem}
details.les .lb{padding:0 18px 16px}
.steps{width:100%;border-collapse:collapse;margin:8px 0}
.steps th{width:130px;text-align:left;vertical-align:top;padding:7px 10px;background:var(--acc2);border:2px solid var(--line);font-size:.86rem}
.steps td{padding:7px 10px;border:2px solid var(--line);background:#fff;font-size:.95rem}
.steps tr.w th{background:#FFE9B8}
.lmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:.88rem}.lmeta span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 10px}
/* laboratorios */
.lab select,.lab input[type=text],.lab textarea{font:700 1rem Nunito,sans-serif;padding:8px 10px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);max-width:100%}
.lab textarea{width:100%;min-height:80px;resize:vertical;font-weight:600}
.qbuild{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:700 1.15rem Fredoka,sans-serif}
.result{margin-top:14px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:14px;font:600 1.25rem/1.35 Fredoka,sans-serif}
.checks{display:grid;gap:6px;margin-top:10px;font-weight:800}
.cat{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed rgba(31,36,51,.2)}
.cat input{width:100%}.cat .n{font:700 1.4rem Fredoka,sans-serif;min-width:34px;text-align:center}
.cat button,.cnt{width:44px;height:44px;border:2.5px solid var(--line);border-radius:10px;background:var(--acc2);font-weight:900;font-size:1.2rem}
.tally{font:700 1.2rem/1 monospace;letter-spacing:2px;color:var(--ink2);grid-column:1/-1;min-height:18px}
.bars{display:grid;gap:8px;margin-top:8px}.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-weight:800;font-size:.9rem}
.bar i{display:block;height:26px;background:var(--acc);border:2.5px solid var(--line);border-radius:6px;min-width:4px;transition:width .3s}
.mx{width:100%;border-collapse:collapse;background:#fff}.mx th,.mx td{border:2.5px solid var(--line);padding:6px 8px;text-align:center;font-size:.92rem}.mx th{background:var(--acc2)}
.mx td:first-child{text-align:left}.mx select{width:100%}.mx .tot{font:700 1.2rem Fredoka,sans-serif}.mx tr.best td{background:#D8F0E2}
.clock{font:700 clamp(3rem,10vw,5rem)/1 Fredoka,sans-serif;text-align:center;margin:6px 0}
.timebar{height:18px;border:3px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}.timebar i{display:block;height:100%;background:var(--acc);width:0}
.partlist{display:grid;gap:6px;margin-top:12px}.partlist div{border:2.5px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff;font-weight:800}.partlist div.on{background:var(--acc);color:var(--accInk)}.partlist div.done{background:#D8F0E2}
.faces{display:flex;gap:6px;flex-wrap:wrap}.faces button{min-width:44px;height:44px;border:2.5px solid var(--line);border-radius:10px;background:#fff;font-size:1.3rem}.faces button[aria-pressed=true]{background:var(--acc2);box-shadow:inset 0 0 0 3px var(--acc)}
.selfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed rgba(31,36,51,.2)}
/* inicio */
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.file{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:#F3D9A4;border:3px solid var(--line);border-radius:6px 16px 16px 16px;box-shadow:var(--sh);padding:18px 16px 16px;position:relative;margin-top:16px;transition:transform .15s}
.file:before{content:"";position:absolute;left:-3px;top:-18px;width:90px;height:20px;background:#F3D9A4;border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
.file:hover{transform:translate(-2px,-2px)}
.file .stamp{position:absolute;right:12px;top:-12px;background:var(--c);color:#fff;border:2.5px solid var(--line);border-radius:8px;padding:2px 10px;font:700 .85rem Fredoka,sans-serif;transform:rotate(4deg)}
.file .ic{font-size:2rem}.file h3{font-size:1.25rem;margin:6px 0 4px}.file small{font-weight:800;color:var(--ink2)}
.file .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.file .st span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.78rem;font-weight:900}
.bigq{background:var(--ink);color:#FFF4D6;border-radius:18px;border:3px solid var(--line);padding:18px 22px;font:600 clamp(1.2rem,2.6vw,1.6rem)/1.35 Fredoka,sans-serif;box-shadow:var(--sh)}
.light{display:flex;gap:14px;flex-wrap:wrap}.light span{display:flex;gap:8px;align-items:center;font-weight:800}.light i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
/* fiesta */
#party{position:fixed;inset:0;pointer-events:none;z-index:90}
.modal{position:fixed;inset:0;background:rgba(31,36,51,.55);display:none;place-items:center;z-index:80;padding:16px}.modal.show{display:grid}
.modal .card{max-width:520px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
.foot{text-align:center;color:var(--ink2);font-size:.86rem;padding:30px 16px 40px}
@media (max-width:760px){body{font-size:16px}.hero .wrap{grid-template-columns:1fr;justify-items:start}.bubble:before{display:none}
 .grid2,.grid3,.vrc,.job,.booklet,.files{grid-template-columns:1fr}.card{padding:16px}.steps th{width:92px}.bar{grid-template-columns:96px 1fr 30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="party"></canvas>
<div id="app"></div>
<div class="modal" id="win" role="dialog" aria-modal="true" aria-labelledby="wint"><div class="card">
 <div id="winowl"></div>
 <h2 id="wint" style="margin:8px 0">¡Expediente resuelto! 🎉</h2>
 <p>Terminaste <b id="winname"></b>, detective. Respuestas al primer intento: <b id="winfirst"></b></p>
 <p>✏️ Escribe en tu cuaderno: una cosa que aprendiste y una que te costó.</p>
 <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" id="winclose">Quedarme aquí</button><a class="btn" id="winnext" href="#inicio">Siguiente expediente →</a></div>

portafolio."]}], "teach": [{"title": "Ciclo 1 · Fase 01 Pregunta problematizadora o SDG", "intro": "Planteamos la pregunta o problema y exploramos qué sabemos y qué queremos descubrir. Al terminar este ciclo, todos los niños pueden explicar la pregunta con sus palabras y ya hay equipos formados por interés.", "weeks": [{"title": "Semana 1 · Nos convertimos en detectives", "n": 1, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (15 min) + práctica individual (35 min) + cierre (10 min)", "Diagnóstico de lectura y escritura con un testimonio breve sobre el descanso. El docente explica los elementos de la comunicación (quién habla, a quién, qué dice, por qué medio). Cada niño identifica esos elementos en el testimonio.", "Prueba diagnóstica impresa; 3 testimonios breves; juego de Wordwall o Kahoot sobre elementos de la comunicación"], ["Clase de Sociales (60 min)", "Explicación del docente (15 min) + trabajo en parejas (35 min) + plenaria (10 min)", "¿Quiénes forman la comunidad escolar? El docente presenta los actores (estudiantes, docentes, directivos, personal de aseo y cafetería, familias). En parejas dibujan quién usa cada espacio. Entre todos arman el mapa de actores del mural.", "Pliego para el mapa de actores; tarjetas con siluetas de actores; fotos de los espacios"], ["Taller del proyecto (180 min)", "Plenaria (40 min) + trabajo de campo en grupos (50 min) + trabajo individual (30 min) + plenaria (40 min) + cierre (20 min)", "Lanzamiento «Algo está pasando en nuestro colegio». El docente presenta el «caso misterioso» con fotos, datos y testimonios reales, y revela la pregunta problematizadora. Se entrega el carné de detective. Caminata de observación por patio, filas, baños y pasillos. Cada niño llena su ficha «Veo – Me pregunto – Me gustaría investigar». En plenaria, lluvia de ideas de posibles soluciones sin elegir ninguna. Cada niño elige la situación que más le inquieta y así se forman los equipos por interés.", "Presentación con fotos y ar.", "Preguntas del Muro transcritas; tarjetas «abierta / cerrada»; juego de clasificación en Wordwall"], ["Clase de Sociales (60 min)", "Explicación del docente (20 min) + trabajo en parejas (30 min) + plenaria (10 min)", "Gobierno escolar. El docente explica los estamentos, cómo se elige al personero y a los representantes, y quién decide sobre los espacios del colegio. En parejas llenan un cuadro comparativo de las propuestas reales de los candidatos: ¿qué propone?, ¿responde a lo que vimos en la caminata?, ¿se puede cumplir? En plenaria justifican cuál ayuda más al grupo y por qué.", "Organigrama del gobierno escolar; propuestas impresas de los candidatos; cuadro comparativo (plantilla). Si las elecciones del colegio son en otra semana, esta clase se traslada a esa semana."], ["Taller del proyecto (180 min)", "Plenaria (20 min) + trabajo por equipos (130 min) + plenaria (30 min)", "Cada equipo llena la ficha de delimitación: qué situación investigamos, dónde y cuándo ocurre, a quién afecta, qué sabemos, qué necesitamos averiguar, qué decisiones sí podemos proponer y cuáles le corresponden a otros. Redactan su pregunta de investigación y su plan. Reparten roles y firman sus acuerdos. Diseñan su afiche de equipo. En plenaria, el docente presenta las metas, los criterios de calidad en lenguaje de niños y el cronograma con las fechas clave. El docente revisa con cada equipo su pregunta y su plan (primera retroalimentación). Primer semáforo.", "Fichas de delimitación; plantilla de plan de trabajo; tarjetas de roles; hoja de acuerdos; cartulina para afiches; criterios de calidad y cronograma impresos en grande para el mural; tabletas con Canva"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Repaso del gobierno escolar (video corto y quiz). Cada equipo sube a su bitácora digital la ficha de delimitación y el cronograma.", "Video y quiz del gobierno escolar; bitácoras digitales por equipo creadas en el AVA"]], "notes": ["Evidencias de la semana: banco de preguntas investigables, cuadro comparativo de las propuestas de los candidatos, ficha de delimitación, pregunta y plan del equipo, afiche con roles y acuerdos.", "Se valora: Sociales, indicador 2 (compara y justifica propuestas de los candidatos del gobierno escolar); Lengua, interpretativa (en inicio).", "El mural al cerrar la semana: se agregan la ruta de las 6 fases con la flecha «estamos aquí», el cronograma, los criterios de calidad, los afiches de equipo y los semáforos."], "x": {"tec": "Wordwall: clasificar preguntas abiertas y cerradas (S2 · Lengua). Canva para Educación: afiche de equipo (S2 · Taller). AVA: cronograma y criterios publicados", "evid": "Banco de preguntas investigables; ficha de delimitación; pregunta y plan del equipo; afiche con roles y acuerdos", "seg": "Retroalimentación 1 (pregunta y plan); asignación de roles; primer semáforo"}}], "notes": []}, {"title": "Ciclo 3 · Fase 03 Investigación", "intro": "Buscamos información, entrevistamos, observamos, analizamos y construimos conocimiento. Al terminar, cada equipo tiene datos propios (observación, entrevistas y encuesta) y tres hallazgos escritos.", "weeks": [{"title": "Semana 3 · Observamos como detectives", "n": 3, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (20 min) + práctica individual (30 min) + cierre (10 min)", "El docente explica qué es una noticia y sus partes (qué, quién, cuándo, dónde, por qué), y repasa sustantivo y artículo. Cada niño lee una noticia breve sobre convivencia escolar y llena su ficha de fuente individual.", "Noticia corta impresa (una por niño); fichas de fuente; diccionarios"], ["Clase de Sociales (60 min)", "Explicación del docente (20 min) + práctica en parejas (30 min) + cierre (10 min)", "Organización del territorio y división política de Colombia. Del colegio al barrio, el municipio, el departamento y el país. Departamentos, capitales y regiones. En parejas ubican el colegio, Medellín y Antioquia en el mapa y colorean las regiones.", "Mapa político de Colombia (uno por pareja); mapa grande para el tablero; Google Earth proyectado; colores"], ["Taller del proyecto (180 min)", "Plenaria (20 min) + trabajo de campo por equipos (90 min) + trabajo por equipos (50 min) + cierre (20 min)", "Observación sistemática. El docente modela cómo llenar la ficha de observación (qué pasa, dónde, cuándo, quiénes, cuántas veces). Los equipos observan su espacio durante un descanso real o un cambio de clase, con un adulto. Cuentan con palitos y toman fotos sin rostros. De regreso, pasan los datos a la bitácora. El docente hace conferencias breves con cada equipo y da retroalimentación individual. Semáforo.", "Fichas de observación; tablillas; tabletas; formulario de observación en Google Forms; acompañantes adultos acordados"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Lectura guiada de una noticia, ficha de fuente individual y práctica de sustantivo y artículo.", "Noticia y actividad montadas en el AVA"]], "notes": ["Evidencias: ficha de fuente individual y ficha de observación."], "x": {"tec": "Tableta: fotos y conteo en ficha de observación digital (Google Forms). Google Earth: ubicar colegio, barrio, municipio y departamento (S3 · Sociales)", "evid": "Ficha de fuente individual; ficha de observación diligenciada", "seg": "Semáforo; conferencias breves y retroalimentación individual"}}, {"title": "Semana 4 · Escuchamos otras voces", "n": 4, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (15 min) + trabajo en parejas (35 min) + cierre (10 min)", "La entrevista. El docente modela una entrevista corta en vivo. En parejas redactan 4 o 5 preguntas abiertas para su guion y lo ensayan entre ellos.", "Ejemplo de entrevista; plantilla de guion; grabadora de la tableta"], ["Clase de Sociales (60 min)", "Explicación del docente (20 min) + trabajo en parejas (30 min) + cierre (10 min)", "Instituciones del municipio y del departamento. Alcaldía, Concejo, Gobernación, Asamblea, juzgados y tribunales: qué hace cada una y qué necesidades atiende. Ventana global: cómo cuidan sus espacios compartidos los niños de otro país. En parejas llenan un cuadro «institución – función – ejemplo» y comparan el colegio con el ejemplo global.", "Tarjetas de instituciones con su función; video o lectura de la ventana global; cuadro comparativo local–global"], ["Taller del proyecto (180 min)", "Plenaria (20 min) + trabajo de campo por equipos (120 min) + plenaria (40 min)", "Trabajo de campo. El docente revisa y aprueba los guiones y la encuesta antes de salir. Los equipos entrevistan a 2 o 3 actores (un estudiante de otro curso, un docente, personal de aseo o cafetería) y aplican la encuesta sencilla. Cada niño registra por escrito al menos una entrevista. Plenaria: ¿qué nos sorprendió? Semáforo con conferencias para los equipos en amarillo o rojo.", "Guiones aprobados; encuesta en Google Forms o impresa; tabletas con grabadora; agenda de entrevistas confirmada con los actores; credenciales de detective"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Ensayo de la entrevista con un familiar (audio). Recurso de la ventana global y cuadro comparativo.", "Instrucciones de la entrevista familiar; recurso global seleccionado"]], "notes": ["Evidencias: guiones, registro individual de una entrevista, respuestas de la encuesta, cuadro institución–función."], "x": {"tec": "Grabadora de voz para entrevistas; encuesta en Google Forms creada con el docente. Google Earth: ubicar el país del ejemplo global (S4 · Sociales)", "evid": "Guías aprobadas; agenda de campo; registro individual de una entrevista; respuestas de encuesta; cuadro comparativo local–global", "seg": "Revisión de instrumentos por el docente antes del campo; semáforo con conferencias a equipos en amarillo o rojo"}}, {"title": "Semana 5 · ¿Qué descubrimos?", "n": 5, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (20 min) + práctica individual (30 min) + cierre (10 min)", "El docente modela el subrayado jerárquico y el mapa de ideas, y explica la diferencia entre hecho y opinión. Cada niño subraya sus notas de entrevista, marca hechos y opiniones y arma un mapa de ideas.", "Notas de entrevista de cada niño; resaltadores de dos colores; plantilla de mapa de ideas"], ["Clase de Sociales (60 min)", "Explicación del docente (15 min) + trabajo por equipos (35 min) + plenaria (10 min)", "Perspectivas y responsabilidades. ¿Qué piensa cada actor de la situación? ¿A quién le corresponde qué? Cada equipo arma su matriz de responsabilidades.", "Plantilla de matriz de responsabilidades; respuestas de las entrevistas"], ["Taller del proyecto (180 min)", "Plenaria (20 min) + trabajo por equipos (120 min) + plenaria (40 min)", "Los equipos cuentan las respuestas de la encuesta, hacen una tabla y un gráfico de barras. Comparan sus fuentes y escriben la hoja «Lo que descubrimos» con 3 hallazgos. Cada niño escribe su párrafo individual «Lo que yo descubrí». Si al equipo le faltan datos, lo anota para completarlo al inicio de la semana 6. El docente da retroalimentación sobre los hallazgos (segunda retroalimentación). Rotación de roles.", "Papel cuadriculado o plantilla de gráfico; tabletas con hoja de cálculo; hoja «Lo que descubrimos»; hoja de párrafo individual"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Práctica de hechos y opiniones. El equipo sube su tabla y su gráfico. Cada niño sube su párrafo.", "Hoja de cálculo compartida por equipo; actividad de hechos y opiniones"]], "notes": ["Evidencias: mapa de ideas, matriz de responsabilidades, tabla y gráfico, hoja «Lo que descubrimos», párrafo individual."], "x": {"tec": "Hoja de cálculo: tabular la encuesta y construir un gráfico de barras. Padlet «Lo que descubrimos»", "evid": "Mapa de ideas; cuadro de perspectivas; matriz de responsabilidades; tabla y gráfico; hoja «Lo que descubrimos»; párrafo individual «Lo que yo descubrí»", "seg": "Rotación de roles; retroalimentación 2 (hallazgos); comprobación del ciclo de investigación"}}], "notes": ["Se valora en el ciclo: Lengua interpretativa y argumentativa; Sociales indicador 1 (instituciones y sus funciones); saber ser de ambas áreas.", "El mural al cerrar el ciclo: se agregan las fotos de la observación, el mapa de Colombia con la ubicación del colegio, el cuadro de instituciones y la zona «Lo que descubrimos» con los gráficos de cada equipo."]}, {"title": "Ciclo 4 · Fase 04 Creación", "intro": "Usamos lo aprendido para desarrollar un producto que responda a la pregunta. Al terminar, cada equipo tiene su propuesta elegida con evidencias, un borrador criticado por otros, la opinión de un actor real y una versión 2 mejorada.", "weeks": [{"title": "Semana 6 · Ideamos soluciones", "n": 6, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (20 min) + trabajo por equipos (30 min) + cierre (10 min)", "Destinatario y propósito. El docente muestra ejemplos de carta, aviso publicitario, noticia e infografía, y analiza para quién y para qué se escribe cada uno. Cada equipo decide el formato de su producto y su destinatario.", "4 ejemplos impresos (carta, aviso, noticia, infografía); tabla «formato – destinatario – propósito»"], ["Clase de Sociales (60 min)", "Explicación del docente (15 min) + trabajo por equipos (35 min) + plenaria (10 min)", "Árbol del problema. El docente modela: raíces = causas, tronco = situación, ramas = consecuencias. Cada equipo arma su árbol con sus hallazgos, marca qué está en sus manos y elige un ODS relacionado.", "Plantilla grande del árbol; notas adhesivas de 3 colores; tarjetas de los ODS"], ["Taller del proyecto (180 min)", "Trabajo por equipos (30 min, completar datos si falta) + trabajo por equipos (110 min) + plenaria (40 min)", "Cada equipo propone al menos 3 soluciones. Las evalúan con la matriz de decisión (¿responde a lo que descubrimos?, ¿se puede hacer?, ¿beneficia a varios?, ¿quién debe aprobarla?). Eligen una y la justifican con sus evidencias. En plenaria cada equipo cuenta su elección en 2 minutos. El docente verifica que la decisión se apoye en datos.", "Matriz de decisión impresa; Padlet de alternativas; puntos adhesivos para votar"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Análisis de avisos de ejemplo y práctica de causas y consecuencias. El equipo sube su matriz de decisión.", "Avisos de ejemplo y actividad montados en el AVA"]], "notes": [], "x": {"tec": "Padlet en columnas para alternativas y votación con la matriz de decisión", "evid": "Árbol del problema; ODS emergente; matriz de decisión; propuesta justificada", "seg": "Semáforo; el docente verifica que la decisión se justifique con evidencias"}}, {"title": "Semana 7 · Hacemos el borrador y lo criticamos", "n": 7, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (15 min) + práctica individual (35 min) + cierre (10 min)", "El docente modela cómo planear un texto y repasa adjetivos, punto, coma y dos puntos. Cada niño escribe la parte del producto que le tocó.", "Organizador de planeación; banco de palabras y de adjetivos; hojas de borrador"], ["Clase de Sociales (60 min)", "Explicación del docente (15 min) + trabajo por equipos (35 min) + cierre (10 min)", "Toma de decisiones y acuerdos. ¿Cómo nos ponemos de acuerdo y cómo le hablamos a un actor? Cada equipo escribe la nota al actor que validará su propuesta y las invitaciones al Foro.", "Plantilla de nota formal; tarjetas de invitación; lista de invitados acordada con coordinación"], ["Taller del proyecto (180 min)", "Trabajo por equipos (90 min) + galería de crítica, todo el grupo (60 min) + trabajo por equipos (30 min)", "Cada equipo une las partes y arma el borrador del producto en papel o en Canva. Galería de crítica: los borradores se cuelgan, los niños rotan y dejan notas «Me gusta – Me pregunto – Te sugiero». El docente da su retroalimentación (tercera retroalimentación). Cada equipo lee sus notas y decide qué cambiar.", "Tabletas con Canva o Book Creator; pliegos; notas adhesivas de 3 colores; cinta para colgar; tarjeta «Me gusta – Me pregunto – Te sugiero»"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Cada niño mejora su parte del texto (puede usar dictado por voz). Práctica de adjetivos y puntuación.", "Actividad de escritura en el AVA"]], "notes": [], "x": {"tec": "Canva para Educación o Book Creator: borrador y comentarios de la galería de crítica. Dictado por voz como apoyo DUA", "evid": "Borrador del producto; parte individual escrita; nota al actor e invitaciones; registro de la crítica", "seg": "Retroalimentación 3 (pares y docente)"}}, {"title": "Semana 8 · Probamos y mejoramos", "n": 8, "sessions": [["Clase de Lengua (60 min)", "Explicación del docente (15 min) + práctica individual (35 min) + cierre (10 min)", "Revisar y editar. El docente explica denotación, connotación y relaciones entre palabras para elegir las palabras justas. Cada niño revisa su parte con la lista de verificación.", "Lista de verificación de escritura; diccionarios"], ["Clase de Sociales (60 min)", "Trabajo por equipos con un actor invitado (45 min) + plenaria (15 min)", "Validación con un actor real. Cada equipo presenta su propuesta en 3 minutos a un actor (coordinador, personal de servicios, representante estudiantil) y pregunta: ¿se puede hacer?, ¿qué cambiaría? Anotan las respuestas.", "Actores invitados y confirmados; hoja de registro de la validación; borradores impresos"], ["Taller del proyecto (180 min)", "Trabajo por equipos (150 min) + plenaria (30 min)", "Cada equipo hace la versión 2 con la crítica y la validación. Revisan con la lista de cotejo que tenga los 9 elementos: situación, pregunta, evidencias, voces consultadas, descubrimientos, propuesta, quiénes pueden participar, razones y siguiente paso. Semáforo de producto.", "Lista de cotejo de los 9 elementos; tabletas; materiales de arte para productos físicos"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Comentarios de pares en el producto digital, onómetro. Cada equipo presenta 4 minutos y responde 3 minutos de preguntas de sus compañeros. Se graba en video. Los compañeros dan retroalimentación con la rúbrica de oralidad. Rotación de roles.", "Tabletas para grabar; rúbrica de oralidad impresa; cronómetro visible"], ["Plataformas (90 min)", "Trabajo individual en el AVA", "Cada niño ve el video de su ensayo y se autoevalúa con la rúbrica de oralidad. Repaso de las normas del foro.", "Videos subidos al AVA; rúbrica de oralidad en formulario"]], "notes": [], "x": {"tec": "Grabación en video del ensayo para autoobservación con la rúbrica de oralidad", "evid": "Guion de presentación; normas del foro; video del ensayo; ajustes", "seg": "Rotación de roles; rúbrica de oralidad (ensayo)"}}, {"title": "Semana 10 · Foro de propuestas para convivir mejor", "n": 10, "sessions": [["Clase de Lengua (60 min)", "Trabajo por equipos (50 min) + cierre (10 min)", "Ensayo final de oralidad: volumen, ritmo, mirada al público y uso de evidencias al responder. Cada equipo corrige lo que vio en su video.", "Videos del ensayo; lista «mi voz, mi mirada, mis evidencias»"], ["Clase de Sociales (60 min)", "Explicación del docente (20 min) + trabajo por equipos (30 min) + cierre (10 min)", "¿Cómo se tramita una propuesta en el colegio? Qué instancia la recibe, qué es un acta y cómo se hace seguimiento. Cada equipo prepara el acta de entrega de su propuesta.", "Modelo de acta de entrega; organigrama del gobierno escolar"], ["Taller del proyecto (180 min)", "Montaje por equipos (30 min) + Foro con audiencia real (110 min) + plenaria de entrega (40 min)", "Foro de propuestas. Se montan las estaciones. La audiencia (coordinación, consejo estudiantil o personero, docentes, personal de servicios, otro curso y familias) escucha a cada equipo: 4 minutos de presentación y 3 de preguntas. La audiencia llena la tarjeta «lo que más me convenció – la evidencia más sólida – una pregunta». Al final, entrega formal de las propuestas a la instancia del col function confetti(){const c=$('#party'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#C8382E','#E8A825','#1F7A57','#2C5DA8','#6B3FA0','#fff'];const P=[];for(let i=0;i<160;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:-2+Math.random()*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:-.2+Math.random()*.4,c:pick(cols)});let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});if(++t<240)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

function renderQ(box,item,onOk,onBad){let h='';if(item.ctx)h+=`<div class="ctx">${item.ctx}</div>`;h+=`<div class="q">${item.q}</div>`;
 if(item.type==='choice')h+=`<div class="opts">${item.opts.map((o,i)=>`<button class="btn" data-i="${i}">${o}</button>`).join('')}</div>`;

 const t=q.toLowerCase().replace(/^¿\s*/,'');const open=/^(por qué|porqué|cómo|como|qué|que|cuál|cuáles|cuándo|dónde|quién|quiénes|cuánto|cuántos|cuántas|para qué)\b/.test(t);const closed=/^(hay|es|son|está|están|te|le|les|puede|pueden|tiene|tienen|fue|hubo|debe|deben|se)\b/.test(t);

conteo:{title:'Conteo y gráfico',sub:'De los palitos al gráfico de barras',html:()=>`<p style="margin-top:0">Cambia los nombres por las situaciones que observó tu equipo y suma con <b>+</b> cada vez que pase.</p>

 const tally=n=>{let s='';for(let i=0;i<Math.floor(n/5);i++)s+='<s>||||</s> ';return s+'|'.repeat(n%5)};

  $$('[data-p]').forEach(b=>b.onclick=()=>{C[+b.dataset.p][1]++;tone(500+C[+b.dataset.p][1]*20,.08,'triangle');draw()});$$('[data-m]').forEach(b=>b.onclick=()=>{const k=+b.dataset.m;if(C[k][1]>0)C[k][1]--;draw()});$$('[data-n]').forEach(inp=>inp.onchange=()=>{C[+inp.dataset.n][0]=inp.value.slice(0,30);draw()})};draw()}},
matriz:{title:'Matriz de decisión',sub:'Tres ideas, una decisión',html:()=>`<p style="margin-top:0">Escribe tres ideas de solución y califica cada criterio: <b>Sí = 2</b>, <b>Más o menos = 1</b>, <b>No = 0</b>.</p>
 <div style="overflow-x:auto"><table class="mx" id="mx"></table></div><div class="result" id="mxout" aria-live="polite" style="font-size:1.1rem"></div>`,init(){const K=['¿Responde a lo que descubrimos?','¿Se puede hacer?','¿Beneficia a varias personas?','¿Sabemos quién debe aprobarla?'];const st=getS('lab4');let I=st.i||[['Idea 1',[1,1,1,1]],['Idea 2',[1,1,1,1]],['Idea 3',[1,1,1,1]]];

cronometro:{title:'Cronómetro del foro',sub:'Ensaya la historia de tu investigación',html:()=>`<p style="margin-top:0">Ensaya con tu equipo: <b>4 minutos</b> para presentar y <b>3 minutos</b> para preguntas. Las partes se iluminan para ayudarte con el tiempo.</p>

reflexion:{title:'Mi reflexión de detective',sub:'Antes pensaba… ahora pienso…',html:()=>`<div class="grid2"><div><label for="rf1"><b>Antes pensaba…</b></label><textarea id="rf1" placeholder="Antes pensaba que…"></textarea></div><div><label for="rf2"><b>Ahora pienso…</b></label><textarea id="rf2" placeholder="Ahora pienso que…"></textarea></div></div>

 ${items.map((x,i)=>`<details class="les" id="les-${S.id}-${i}"${i===0?' open':''}><summary><span class="ln">${i+1}</span><h4>Semana ${x.w.n} · ${E(x.nm)}</h4><span class="stg ${x.k}">${E(x.min)}</span></summary><div class="lb"><table class="steps"><tr><th>Cómo se trabaja</th><td>${E(x.r[1])}</td></tr><tr><th>Qué hacemos</th><td>${E(x.r[2])}</td></tr><tr><th>Materiales</th><td>${E(x.r[3])}</td></tr>${x.k==='P'?`<tr class="prog-row"><th>Progrentis</th><td>Sesión de lectura de la semana en Progrentis. <a href="${PROG_URL}" target="_blank" rel="noopener noreferrer">Abrir Progrentis ↗</a></td></tr>`:''}${x.k==='P'&&x.w.x.tec?`<tr><th>Tecnología</th><td>${E(x.w.x.tec)}</td></tr>`:''}${x.k==='T'&&x.w.x.seg?`<tr class="w"><th>Seguimiento</th><td>${E(x.w.x.seg)}</td></tr>`:''}</table><div class="lmeta"><span>🖥️ En esta página: ${USE[x.k]}</span><span>⏱️ ${E(x.min)}</span></div></div></details>`).join('')}
 </section>
 ${T.weeks.map(w=>`<section class="sec card"><div class="sechead"><div class="num">${w.n}</div><div><h3>${E(w.title)}</h3><span class="sub">Evidencias, valoración y mural</span></div></div>${w.notes.map(t=>`<p>${E(t).replace(/^([^:]{1,45}):/,'<b>$1:</b>')}</p>`).join('')||`<p><b>Evidencias de la semana:</b> ${E(w.x.evid||'')}</p>`}</section>`).join('')}
 ${T.notes.length?`<section class="sec card"><div class="sechead"><div class="num">🏁</div><div><h3>Cierre de la fase</h3><span class="sub">Según la guía docente</span></div></div>${T.notes.map(t=>`<p>${E(t).replace(/^([^:]{1,45}):/,'<b>$1:</b>')}</p>`).join('')}</section>`:''}`}
function station(S,tab){return bar(S)+`<section class="hero"><div class="wrap">${owl(130,'bob')}<div><div class="kicker">${E(S.phase)} · Expediente ${S.id} de 6</div><h2>${E(S.title)}</h2><div class="bubble">🦉 ${S.bubble}<button class="olv" id="olv" type="button" aria-label="Escuchar a Olivia">🔊 Escuchar a Olivia</button></div></div></div></section>
 <div class="wrap"><div class="tabs" role="tablist"><a class="tab ${tab==='s'?'on':''}" role="tab" aria-selected="${tab==='s'}" href="#expediente-${S.id}" style="text-decoration:none">🔎 Ruta del detective</a><a class="tab ${tab==='t'?'on':''}" role="tab" aria-selected="${tab==='t'}" href="#expediente-${S.id}-docente" style="text-decoration:none">📋 Clases del docente</a></div><div class="tabline"></div>
 ${tab==='s'?student(S):teacher(S)}</div>`}
function render(){if(window.__stopClock)window.__stopClock();window.__stopClock=null;const h=(location.hash||'#inicio').slice(1);let m=h.match(/^expediente-([1-6])(-docente)?$/);const root=document.documentElement;
 if(!m){root.style.setProperty('--acc','#C8382E');root.style.setProperty('--acc2','#FBE0DC');app.innerHTML=home()}
 else{const S=D.st[+m[1]-1];root.style.setProperty('--acc',S.color);root.style.setProperty('--acc2',S.tint);app.innerHTML=station(S,m[2]?'t':'s');
  if(!m[2]){setupGate(S);setupChallenges(S);setupTask(S);LABS[S.lab].init()}
  else{const oa=$('#openall');oa.onclick=()=>{const any=$$('details.les').some(d=>!d.open);$$('details.les').forEach(d=>d.open=any);oa.textContent=any?'Cerrar todas':'Abrir todas'};$$('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();const d=document.getElementById(a.dataset.open);d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})})}}
 const mb=$('#mute');mb.onclick=()=>{muted=!muted;try{localStorage.setItem('agencia_mute',muted?'1':'0')}catch(e){}mb.textContent=muted?'🔇':'🔊';if(muted){SS&&SS.cancel()}else if($('#olv'))sayOlivia()};oTxt=m?D.st[+m[1]-1].bubble.replace(/<[^>]+>/g,''):OLIVIA_TXT;const ob=$('#olv');if(ob)ob.onclick=sayOlivia}
addEventListener('hashchange',()=>{SS&&SS.cancel();render();scrollTo(0,0)});render();
}
</script>
</body>
