<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Para qué sirve? · Olivia te cuenta · Agencia de Detectives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{--ink:#1F2433;--ink2:#4A5168;--paper:#FFFBF2;--red:#C8382E;--gold:#E8A825;--green:#1F8A4C;--blue:#2C5DA8;--sh:0 5px 0 #1F2433}
*{box-sizing:border-box}
html,body{margin:0;background:#CDEBF5;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
.stage{position:relative;min-height:620px;height:100vh;max-height:760px;overflow:hidden;display:grid;grid-template-columns:minmax(220px,34%) 1fr;gap:12px;padding:18px 22px 18px 10px}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.cloud{animation:drift linear infinite}
.c1{animation-duration:70s}.c2{animation-duration:95s;animation-delay:-40s}.c3{animation-duration:120s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1160px)}}
.rays{transform-origin:860px 108px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bfly{animation:flut 7s ease-in-out infinite}
.bfly .wing{transform-box:fill-box;transform-origin:right center;animation:flap .25s ease-in-out infinite alternate}
.bfly2{animation-duration:9s;animation-delay:-3s}
@keyframes flut{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(90px,-5px)}75%{transform:translate(40px,20px)}}
@keyframes flap{to{transform:scaleX(.35)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

/* Olivia */
.left{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:4px}
.hint{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font:800 1rem Nunito,sans-serif;box-shadow:var(--sh);max-width:250px;margin-bottom:14px;text-align:center;transition:transform .3s}
.hint:after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:12px solid transparent;border-top-color:var(--ink);border-bottom:0}
.hint:before{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:9px solid transparent;border-top-color:#fff;border-bottom:0;z-index:1}
.owlbox{position:relative;width:min(230px,90%);display:flex;flex-direction:column;align-items:center}
.owl{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(31,36,51,.18));animation:idle 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.talking .owl{animation:talk .42s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-6px) rotate(1.5deg)}}
.pupil{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.jaw{transform-box:fill-box;transform-origin:top center}
.talking .jaw{animation:jaw .18s ease-in-out infinite alternate}
@keyframes jaw{to{transform:translateY(5px) scaleY(1.25)}}
.stump{width:78%;margin-top:-14px;display:block}
.name{margin-top:6px;background:var(--ink);color:#FFF4D6;border-radius:999px;padding:4px 14px;font:700 .95rem Fredoka,sans-serif}

/* Board */
.board{position:relative;z-index:2;align-self:center;background:rgba(255,251,242,.985);border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;max-height:calc(100% - 4px);min-height:0}
.bhead{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;border-bottom:3px dashed #D9CBA8}
.bhead .ic{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:#FFE7A8;display:grid;place-items:center;font-size:1.5rem;flex:none}
.kicker{font:800 .78rem Nunito,sans-serif;color:var(--red);letter-spacing:.04em;text-transform:uppercase}
h1{font:700 1.75rem/1.1 Fredoka,sans-serif;margin:2px 0 0}
.text{flex:1;overflow:auto;padding:14px 22px 6px;font-size:1.08rem;line-height:1.55;scroll-behavior:smooth;min-height:120px}
.empty{color:var(--ink2);font-weight:800;text-align:center;padding:30px 10px;border:3px dashed #D9CBA8;border-radius:18px;margin:6px 0}
.seg{display:none;margin:0 0 10px}
.seg.on{display:block;animation:pop .35s ease-out}
.seg.li.on{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.w{opacity:0;transition:opacity .25s,background .4s;border-radius:4px}
.w.s{opacity:1}
.w.now{background:#FFE7A8}
b .w,.w.b{font-weight:900}
.li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:0 0 8px}
.li .bul{flex:none;width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);display:grid;place-items:center;font-size:1.15rem}
.q{background:#22304F;color:#FFF4D6;border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font:600 1.15rem/1.4 Fredoka,sans-serif}
.q .w.now{background:#E8A825;color:var(--ink)}
.q:before{content:"🔎 Nuestra gran pregunta";display:block;font:800 .78rem Nunito,sans-serif;color:#FFD36B;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 8px;background:#fff;font-weight:900;opacity:0;transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.chip.on{opacity:1;transform:none}
.chip span{font-size:1.2rem}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px 14px;border-top:3px dashed #D9CBA8}
button{font:900 1rem Nunito,sans-serif;border:3px solid var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 4px 0 var(--ink);background:#fff;color:var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.play{background:var(--red);color:#fff;font-size:1.1rem}
.prog{flex:1;min-width:90px;height:12px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.note{font-size:.8rem;color:var(--ink2);font-weight:700;width:100%;margin:0}

@media (max-width:720px){
 .stage{grid-template-columns:1fr;height:auto;max-height:none;padding:12px}
 .left{flex-direction:row-reverse;align-items:flex-end;gap:12px;justify-content:flex-end}
 .owlbox{width:120px}
 .hint{margin-bottom:40px;font-size:.9rem}
 .hint:after{left:-14px;top:50%;bottom:auto;transform:translateY(-50%);border:12px solid transparent;border-right-color:var(--ink);border-left:0}
 .hint:before{left:-8px;top:50%;bottom:auto;transform:translateY(-50%);border:9px solid transparent;border-right-color:#fff;border-left:0}
 h1{font-size:1.4rem}.text{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const SEG=[
 {k:'p',t:'Este recurso es la **Agencia** **de** **Detectives**, la misión de nuestro proyecto «Detectives de nuestra comunidad». Sirve para que investigues como un detective cómo convivimos en los espacios que compartimos en el colegio: el patio, las filas, los baños y los pasillos.',chips:[['patio','🌳','El patio'],['filas','🚶','Las filas'],['baños','🚻','Los baños'],['pasillos','🚪','Los pasillos']]},
 {k:'p',t:'En cada expediente vas a:'},
 {k:'li',ic:'🔑',bg:'#FFE7A8',t:'**Activar** lo que ya sabes con un calentamiento.'},
 {k:'li',ic:'📚',bg:'#DCE8FA',t:'**Aprender** palabras y conceptos de Lengua y Ciencias Sociales: la comunicación, las preguntas, la noticia, las instituciones y los hechos y las opiniones.'},
 {k:'li',ic:'🧪',bg:'#DDF3E4',t:'**Practicar** en un laboratorio interactivo y en una ruta de retos con respuesta inmediata.'},
 {k:'li',ic:'🤝',bg:'#FBE0DC',t:'**Avanzar** en la tarea de tu equipo para construir una propuesta y presentarla en el Foro.'},
 {k:'p',t:'Así podremos responder juntos nuestra gran pregunta:'},
 {k:'q',t:'¿Cómo podríamos mejorar la convivencia en los espacios que compartimos en nuestro colegio para que todos nos sintamos respetados, escuchados y cuidados?'}
];
const $=s=>document.querySelector(s);
const textEl=$('#text'),stage=$('#stage'),hint=$('#hint'),playB=$('#play'),bar=$('#bar');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zñ]/g,'');
// Construir segmentos y palabras
const UNITS=[];
SEG.forEach((s,si)=>{
 const el=document.createElement('div');el.className='seg '+s.k;
 let inner=el;
 if(s.k==='li'){el.className='seg li';el.innerHTML=`<div class="bul" style="background:${s.bg}">${s.ic}</div><div class="lt"></div>`;inner=el.querySelector('.lt')}
 if(s.k==='q'){el.className='seg q'}
 s.el=el;s.words=[];
 const toks=s.t.split(' ');
 toks.forEach((tk,i)=>{const bold=/^\*\*.*\*\*/.test(tk);const plain=tk.replace(/\*\*/g,'');const sp=document.createElement('span');sp.className='w'+(bold?' b':'');sp.textContent=plain;inner.appendChild(sp);if(i<toks.length-1)inner.appendChild(document.createTextNode(' '));s.words.push({el:sp,plain,key:norm(plain)})});
 if(s.chips){const c=document.createElement('div');c.className='chips';s.chipEls={};s.chips.forEach(([k,ic,l])=>{const d=document.createElement('span');d.className='chip';d.innerHTML=`<span>${ic}</span>${l}`;c.appendChild(d);s.chipEls[norm(k)]=d});s.chipRow=c}
 // dividir en frases cortas para que la voz no se corte
 let start=0;
 s.words.forEach((w,i)=>{const end=/[.:?!]$/.test(w.plain)||/»\.$/.test(w.plain);if(end||i===s.words.length-1){UNITS.push({si,a:start,b:i});start=i+1}});
});
UNITS.forEach(u=>{const s=SEG[u.si];let off=0;u.offs=[];const parts=[];for(let i=u.a;i<=u.b;i++){u.offs.push(off);parts.push(s.words[i].plain);off+=s.words[i].plain.length+1}u.text=parts.join(' ')});

// Voz
const SS=window.speechSynthesis||null;let voice=null;
const FEM=/paulina|m[oó]nica|helena|laura|sabina|dalia|elvira|luc[ií]a|paloma|marisol|ximena|salom[eé]|camila|valentina|francisca|catalina|elena|esperanza|renata|soledad|marta|carmen|in[eé]s|sof[ií]a|isabela|female|mujer|google espa[nñ]ol/i;
const MALE=/jorge|pablo|diego|ra[uú]l|juan|carlos|[aá]lvaro|enrique|jaime|andr[eé]s|gonzalo|alonso|tom[aá]s|hombre|emilio|federico|gerardo|lorenzo|manuel|mateo|\bmale\b/i;
function pickVoice(){if(!SS)return null;const v=SS.getVoices().filter(x=>/^es/i.test(x.lang));if(!v.length)return null;const sc=x=>(FEM.test(x.name)?10:0)-(MALE.test(x.name)?20:0)+(/es[-_](CO|419|MX|US)/i.test(x.lang)?3:/es[-_]ES/i.test(x.lang)?1:0)+(x.localService?1:0);return v.slice().sort((a,b)=>sc(b)-sc(a))[0]}
if(SS){voice=pickVoice();SS.onvoiceschanged=()=>{voice=pickVoice()}}

// Estado
let cur=0,playing=false,done=false,gen=0,timer=null,lastWord=null;
const shown=new Set();
function showSeg(si){const s=SEG[si];if(s.el.classList.contains('on'))return;$('#empty')?.remove();textEl.appendChild(s.el);if(s.chipRow)textEl.appendChild(s.chipRow);s.el.classList.add('on')}
function reveal(si,idx){const s=SEG[si];for(let i=0;i<=idx&&i<s.words.length;i++){const w=s.words[i];if(!w.el.classList.contains('s')){w.el.classList.add('s');if(s.chipEls&&s.chipEls[w.key])s.chipEls[w.key].classList.add('on')}}
 if(lastWord)lastWord.classList.remove('now');lastWord=s.words[Math.min(idx,s.words.length-1)].el;if(playing)lastWord.classList.add('now');
 const r=lastWord.getBoundingClientRect(),tr=textEl.getBoundingClientRect();if(r.bottom>tr.bottom-8||r.top<tr.top)textEl.scrollTop+=r.bottom-tr.bottom+40}
function setProg(){bar.style.width=Math.round(cur/UNITS.length*100)+'%'}
function talking(on){stage.classList.toggle('talking',on)}
function stopAll(){gen++;clearInterval(timer);timer=null;if(SS)SS.cancel();talking(false);if(lastWord)lastWord.classList.remove('now')}
function finish(){playing=false;done=true;talking(false);if(lastWord)lastWord.classList.remove('now');cur=UNITS.length;setProg();playB.textContent='↺ Escuchar otra vez';hint.innerHTML='¡Ahora ya sabes para qué sirve la Agencia! 🕵️ Abre el primer expediente.';textEl.scrollTop=textEl.scrollHeight}
function nextUnit(g){if(g!==gen)return;cur++;setProg();setTimeout(()=>{if(g===gen&&playing)playUnit()},280)}
function timedReveal(u,g,from,ms,then){let i=from;clearInterval(timer);timer=setInterval(()=>{if(g!==gen){clearInterval(timer);return}if(i>u.b){clearInterval(timer);timer=null;then&&then();return}reveal(u.si,i-u.a+u.a);i++},ms)}
function playUnit(){
 if(cur>=UNITS.length){finish();return}
 const u=UNITS[cur],g=gen;showSeg(u.si);
 const useVoice=SS&&!mute;
 if(!useVoice){talking(true);timedReveal(u,g,u.a,330,()=>{reveal(u.si,u.b);nextUnit(g)});return}
 const ut=new SpeechSynthesisUtterance(u.text);voice=voice||pickVoice();if(voice){ut.voice=voice;ut.lang=voice.lang}else ut.lang='es-CO';
 ut.rate=.95;ut.pitch=1.3;let gotB=false,fb=null;
 ut.onboundary=e=>{if(g!==gen)return;if(e.name&&e.name!=='word')return;gotB=true;if(timer){clearInterval(timer);timer=null}let k=0;while(k+1<u.offs.length&&u.offs[k+1]<=e.charIndex)k++;reveal(u.si,u.a+k)};
 ut.onstart=()=>{if(g!==gen)return;talking(true);fb=setTimeout(()=>{if(!gotB&&g===gen)timedReveal(u,g,u.a,400)},700)};
 ut.onend=()=>{clearTimeout(fb);if(g!==gen)return;clearInterval(timer);timer=null;reveal(u.si,u.b);talking(false);nextUnit(g)};
 ut.onerror=e=>{clearTimeout(fb);if(g!==gen)return;if(e.error==='interrupted'||e.error==='canceled')return;
  // sin voz disponible: seguir en modo lectura
  mute=true;$('#note').textContent='Este equipo no tiene voz disponible: el texto aparece solo.';playUnit()};
 SS.cancel();setTimeout(()=>{if(g===gen&&playing)SS.speak(ut)},60);
}
let mute=!SS;
if(!SS)$('#note').textContent='Este navegador no tiene voz: el texto aparecerá poco a poco.';
playB.onclick=()=>{
 if(playing){stopAll();playing=false;playB.textContent='▶ Seguir';hint.textContent='Estoy en pausa. Toca ▶ Seguir cuando quieras.';return}
 if(done){stopAll();SEG.forEach(s=>{s.el.classList.remove('on');s.el.remove();s.words.forEach(w=>w.el.classList.remove('s','now'));if(s.chipRow){s.chipRow.remove();Object.values(s.chipEls).forEach(c=>c.classList.remove('on'))}});cur=0;done=false;setProg()}
 stopAll();playing=true;playB.textContent='⏸ Pausa';hint.innerHTML='🗣️ Escucha y lee conmigo…';playUnit()};
$('#all').onclick=()=>{stopAll();SEG.forEach((s,i)=>{showSeg(i);reveal(i,s.words.length-1)});finish();textEl.scrollTop=0};
</script>
</body>
